server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The Angular router owns the paths, so every unknown path returns index.html rather than a
    # 404. Without this a page reload on any route but / fails.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build output never changes under the same name.
    location ~* \.(js|css|woff2?|png|jpe?g|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must not be cached, or a deployment stays invisible until the browser gives up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
