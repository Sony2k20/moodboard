# Generic defaults only. Environment-specific values — domain, issuer URL, secret names, UID,
# HostPath — are set in the ArgoCD Application and therefore live outside this repository
# (concept §4.3). There is deliberately no values.local.yaml.

image:
  registry: ghcr.io/owner
  # Empty means Chart.AppVersion, the released version — leave it empty and pin the chart's git tag
  # instead; chart and images then cannot drift apart. sha-<commit> only to try an unreleased build.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecret: ghcr-pull
  names:
    api: moodboard-api
    worker: moodboard-worker
    web: moodboard-web

ingress:
  kind: IngressRoute # IngressRoute | Ingress
  host: moodboard.example.com
  entryPoints: [websecure]
  middlewares: [] # e.g. compress, security-headers
  className: "" # Ingress only
  annotations: {}
  tls:
    certResolver: "" # or:
    secretName: ""

postgres:
  # Created by CloudNativePG when it bootstraps the database cluster, not by this chart
  # (§4.3.1). Its keys are the operator's: uri, host, port, dbname, username, password.
  existingSecret: moodboard-database-app

oidc:
  # Off only while there is nothing to protect. The application is exposed to the internet and
  # access is invite-only through the IdP (§9), so a deployment carrying real assets without
  # authentication is not a configuration — it is a data leak. Disabling it therefore does not
  # merely omit the OIDC variables: the api is told AUTH_MODE=disabled and refuses to serve
  # anything but health and the UI shell, so the gap fails closed rather than quietly open.
  enabled: true
  issuerUrl: https://auth.example.com/application/o/moodboard/
  clientId: moodboard
  existingSecret: moodboard-oidc # clientSecret
  # Authentik groups mapped to the two roles (§9), compared exactly. A user in neither group is
  # refused even if Authentik lets them through; admin wins if a user is in both.
  adminGroup: moodboard-admins
  memberGroup: moodboard-users

emergencyAdmin:
  # Local login that bypasses Authentik, for when the IdP is down (§4.10). Off by default; when
  # on, it answers only on its own port, and that port is routed only from the entry points
  # below — which must be LAN-only. The source IP is not used: behind the cluster load balancer
  # LAN traffic is source-NATed, so an address check would be meaningless.
  enabled: false
  existingSecret: moodboard-emergency-admin # passwordHash, from tools/hash-password.mjs
  port: 3001
  entryPoints: [websecure]

valkey:
  deploy: true # false -> use an external instance
  host: "" # only when deploy: false
  port: 6379
  # Prefix of every key the application writes, queue and sessions alike. Distinct per
  # installation sharing one Valkey, so one installation's worker never takes another's jobs.
  prefix: mb
  image: valkey/valkey:9.0-alpine
  resources:
    requests: { memory: 100Mi, cpu: 50m }
    limits: { memory: 200Mi, cpu: 500m }

storage:
  hostPath: /srv/moodboard/assets
  # The node directory must be owned by this UID/GID:
  #   sudo mkdir -p /srv/moodboard/assets && sudo chown -R 1000:1000 /srv/moodboard
  # fsGroup has no effect on hostPath volumes — Kubernetes accepts it and ignores it — so this is
  # a manual, one-time step on the node (§4.2).
  runAsUser: 1000
  runAsGroup: 1000
  # Required when the cluster has more than one node: api and worker must land on the node that
  # holds the files. Empty means no pinning, which is only safe on a single node.
  nodeName: ""

llm:
  # Off until the classification pipeline exists. Uploads then still work and assets stay
  # status=pending; they are classified once it is on, which is the same path a failed classify
  # job already takes (§7.1).
  enabled: true
  provider: anthropic
  model: claude-opus-5
  existingSecret: moodboard-llm
  # The key inside that secret. Configurable because one API-key secret is often shared by
  # several applications, each reading its own key.
  existingSecretKey: apiKey
  monthlyCostLimitUsd: 25

i18n:
  defaultLocale: en # en | de
  availableLocales: [en, de]

migration:
  # The migration runs as an initContainer in front of api and worker, not as an ArgoCD PreSync
  # hook: the ordering then holds under any deployment tool, and a failed migration leaves the
  # new pod unready while the previous one keeps serving (§4.11). Off only to run migrations by
  # hand — the same `node migrate.js` from the api image.
  enabled: true
  resources:
    requests: { memory: 128Mi, cpu: 50m }
    limits: { memory: 512Mi, cpu: "1" }

api:
  replicas: 1
  port: 3000
  resources:
    requests: { memory: 400Mi, cpu: 100m }
    limits: { memory: 700Mi, cpu: "1" }

web:
  replicas: 1
  # The unprivileged nginx image listens here, so no privileged port binding is needed.
  port: 8080
  resources:
    requests: { memory: 50Mi, cpu: 20m }
    limits: { memory: 128Mi, cpu: 500m }

worker:
  replicas: 1
  concurrency: 2
  # Containers default to 64 MB of /dev/shm and Chromium crashes on larger pages with that. The
  # single most common cause of "works locally, dies in the cluster" (§4.6).
  shmSize: 1Gi
  resources:
    requests: { memory: 512Mi, cpu: 250m }
    limits: { memory: 2.5Gi, cpu: "2" }

cloudflared:
  # The tunnel may already exist in the cluster; then leave this off and add the hostname to the
  # existing tunnel's configuration instead.
  deploy: false
  image: cloudflare/cloudflared:2026.10.0
  existingSecret: moodboard-cloudflared # token
  resources:
    requests: { memory: 50Mi, cpu: 20m }
    limits: { memory: 100Mi, cpu: 200m }
