apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moodboard.fullname" . }}-api
  labels:
    {{- include "moodboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "moodboard.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- if not .Values.oidc.enabled }}
      annotations:
        # Visible in `kubectl describe`, so this state cannot hide in a values file.
        moodboard.dev/auth: disabled
      {{- end }}
    spec:
      {{- include "moodboard.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "moodboard.securityContext" . | nindent 8 }}
      {{- include "moodboard.nodeAffinity" . | nindent 6 }}
      {{- include "moodboard.migrationInitContainer" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "moodboard.image" (dict "root" . "component" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
            {{- if .Values.emergencyAdmin.enabled }}
            - name: emergency
              containerPort: {{ .Values.emergencyAdmin.port }}
            {{- end }}
          # Liveness only: the endpoint touches neither the database nor Valkey nor the IdP, so an
          # Authentik outage does not restart the api — the emergency admin needs it running.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
          env:
            - name: PORT
              value: {{ .Values.api.port | quote }}
            {{- include "moodboard.databaseEnv" . | trim | nindent 12 }}
            {{- include "moodboard.queueEnv" . | trim | nindent 12 }}
            # Always explicit, never inferred from a missing variable: the api refuses to serve
            # data endpoints unless this says oidc (§9).
            - name: AUTH_MODE
              value: {{ if .Values.oidc.enabled }}oidc{{ else }}disabled{{ end }}
            {{- if .Values.oidc.enabled }}
            - name: OIDC_ISSUER_URL
              value: {{ .Values.oidc.issuerUrl | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "oidc.existingSecret is required when oidc.enabled is true" .Values.oidc.existingSecret }}
                  key: clientSecret
            - name: OIDC_ADMIN_GROUP
              value: {{ required "oidc.adminGroup is required when oidc.enabled is true" .Values.oidc.adminGroup | quote }}
            - name: OIDC_MEMBER_GROUP
              value: {{ required "oidc.memberGroup is required when oidc.enabled is true" .Values.oidc.memberGroup | quote }}
            {{- end }}
            - name: EMERGENCY_ADMIN_ENABLED
              value: {{ .Values.emergencyAdmin.enabled | quote }}
            {{- if .Values.emergencyAdmin.enabled }}
            - name: EMERGENCY_ADMIN_PORT
              value: {{ .Values.emergencyAdmin.port | quote }}
            - name: EMERGENCY_ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ required "emergencyAdmin.existingSecret is required when emergencyAdmin.enabled is true" .Values.emergencyAdmin.existingSecret }}
                  key: passwordHash
            {{- end }}
            - name: PUBLIC_URL
              value: {{ printf "https://%s" .Values.ingress.host | quote }}
            - name: STORAGE_ROOT
              value: {{ .Values.storage.hostPath | quote }}
            # The api shows when an asset leaves the trash; the worker purges it then (0006).
            - name: TRASH_RETENTION_DAYS
              value: {{ .Values.trash.retentionDays | quote }}
            - name: DEFAULT_LOCALE
              value: {{ .Values.i18n.defaultLocale | quote }}
            - name: AVAILABLE_LOCALES
              value: {{ join "," .Values.i18n.availableLocales | quote }}
          volumeMounts:
            # The api serves what the worker writes, which is why both are pinned to one node.
            - name: assets
              mountPath: {{ .Values.storage.hostPath }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: assets
          hostPath:
            path: {{ .Values.storage.hostPath }}
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "moodboard.fullname" . }}-api
  labels:
    {{- include "moodboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
    {{- if .Values.emergencyAdmin.enabled }}
    - name: emergency
      port: {{ .Values.emergencyAdmin.port }}
      targetPort: emergency
    {{- end }}
