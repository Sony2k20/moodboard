{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  # The name carries the image tag: ArgoCD creates the hook anew per sync, and a Job's pod
  # template is immutable, so a fixed name would fail on the second sync with a different tag.
  name: {{ printf "%s-migrate-%s" (include "moodboard.fullname" .) (default .Chart.AppVersion .Values.image.tag | replace "." "-" | trunc 20 | trimSuffix "-") }}
  labels:
    {{- include "moodboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    # ArgoCD runs this before the rollout and aborts the sync if it fails. Helm's own
    # pre-upgrade hooks are the wrong tool: ArgoCD only renders the chart and does not apply
    # Helm hook semantics (§4.11).
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "moodboard.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      {{- include "moodboard.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "moodboard.securityContext" . | nindent 8 }}
      containers:
        # The api image, second entry point. Same build as the rollout, so the schema and the
        # code that expects it cannot come from different commits.
        - name: migrate
          image: {{ include "moodboard.image" (dict "root" . "component" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "migrate.js"]
          env:
            {{- include "moodboard.databaseEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
{{- end }}
