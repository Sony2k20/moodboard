name: Publish images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The automatically provided GITHUB_TOKEN is enough to push to GHCR, so there is no extra
      # secret and no rotation concern (§4.8).
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: moodboard-api
            dockerfile: apps/api/Dockerfile
          - image: moodboard-worker
            dockerfile: apps/worker/Dockerfile
          - image: moodboard-web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          # `sha-<commit>` on every build, `v<semver>` on releases. The point is rollback: a
          # `helm rollback` to the previous tag is a matter of seconds (§4.8).
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Shared cache per image, so a source-only change does not reinstall dependencies.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
