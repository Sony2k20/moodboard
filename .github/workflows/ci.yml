name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Nx needs the base commit to work out what changed.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint, test, build
        run: npx nx run-many -t lint,test,build

      - name: Schema matches the committed migrations
        # `drizzle-kit generate` needs no database: it diffs the schema against the migration
        # snapshots. A non-empty diff means someone changed the schema without generating the
        # migration, which would only surface at deploy time otherwise.
        run: |
          npx drizzle-kit generate
          if ! git diff --quiet -- libs/db/migrations; then
            echo "::error::The schema and the committed migrations disagree. Run 'npm run db:generate' and commit the result."
            git diff --stat -- libs/db/migrations
            exit 1
          fi

  image-contents:
    name: Bundle runs with the pruned dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Build and prune the api
        run: npx nx prune api

      - name: Install only the pruned dependencies and start the bundle
        # What the image contains, nothing else. `nx prune` derives those dependencies from
        # apps/api/package.json, not from the imports of the libraries webpack compiles into the
        # bundle — so a package the application needs but does not declare is missing in the
        # container and fails at start-up. Here it fails in CI instead.
        #
        # The database is deliberately unreachable: the migration must get far enough to attempt
        # a connection. A MODULE_NOT_FOUND means a dependency is missing from the declaration.
        run: |
          mkdir -p /tmp/image-sim
          cp dist/apps/api/package.json dist/apps/api/package-lock.json /tmp/image-sim/
          cd /tmp/image-sim
          npm ci --omit=dev --ignore-scripts
          cp -r "$GITHUB_WORKSPACE"/dist/apps/api/* .
          output=$(DATABASE_URL=postgresql://u:p@127.0.0.1:1/none node migrate.js 2>&1 || true)
          echo "$output" | head -5
          if echo "$output" | grep -q MODULE_NOT_FOUND; then
            echo "::error::The image is missing a runtime dependency. Declare it in apps/api/package.json."
            exit 1
          fi
          if ! echo "$output" | grep -qi 'migration failed'; then
            echo "::error::The migration bundle did not run as expected."
            exit 1
          fi

      - name: The same for the worker
        # The worker carries sharp, a native module whose Linux binaries come in as optional
        # dependencies — exactly what a pruned lockfile can lose. It has no exit of its own, so it
        # runs for a few seconds against unreachable services and must not fail to load.
        run: |
          npx nx prune worker
          mkdir -p /tmp/worker-sim
          cp dist/apps/worker/package.json dist/apps/worker/package-lock.json /tmp/worker-sim/
          cd /tmp/worker-sim
          npm ci --omit=dev --ignore-scripts
          cp -r "$GITHUB_WORKSPACE"/dist/apps/worker/* .
          node -e "require('sharp')"
          output=$(DATABASE_URL=postgresql://u:p@127.0.0.1:1/none VALKEY_PORT=1 timeout -k 30 10 node main.js 2>&1 || true)
          echo "$output" | head -5
          if echo "$output" | grep -q MODULE_NOT_FOUND; then
            echo "::error::The worker image is missing a runtime dependency. Declare it in apps/worker/package.json."
            exit 1
          fi
          echo "$output" | grep -q 'Worker started'

  translations:
    name: Translation keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: en.json and de.json have the same keys
        # Transloco cannot check translation keys at compile time, unlike the template extraction
        # @angular/localize performs. This check is the mitigation the concept names for that
        # trade-off (§13.1). It is set up before the files exist, because a check added afterwards
        # tends to arrive after the files have already drifted.
        run: node tools/check-translations.mjs

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4

      - run: helm lint deploy/chart

      - name: Renders with the defaults
        run: helm template moodboard deploy/chart > /dev/null

      - name: Renders the Ingress variant and an external Valkey
        run: |
          helm template moodboard deploy/chart --set ingress.kind=Ingress > /dev/null
          helm template moodboard deploy/chart \
            --set valkey.deploy=false --set valkey.host=valkey.example.com > /dev/null

      - name: Refuses an external Valkey without a host
        # valkey.host is `required` when the chart does not deploy one: without it the workers
        # would start and queue into nothing, which looks like a stuck pipeline rather than a
        # missing value.
        run: |
          if helm template moodboard deploy/chart --set valkey.deploy=false > /dev/null 2>&1; then
            echo "::error::The chart rendered without a Valkey host. valkey.host must stay required."
            exit 1
          fi

      - name: Refuses an unknown ingress kind
        run: |
          if helm template moodboard deploy/chart --set ingress.kind=Nope > /dev/null 2>&1; then
            echo "::error::The chart rendered an unknown ingress.kind instead of failing."
            exit 1
          fi

      - name: The migration runs before api and worker, under any tool
        # An ArgoCD hook would order this only under ArgoCD; an initContainer is ordered by
        # Kubernetes, so helm upgrade and kubectl apply behave the same. Getting it wrong means
        # the new version starts against the old schema — seemingly random runtime errors rather
        # than a failed deploy (§4.11).
        run: |
          rendered=$(helm template moodboard deploy/chart)
          echo "$rendered" | awk '/component: api/,/^---/' | grep -q 'name: migrate'
          echo "$rendered" | awk '/component: worker/,/^---/' | grep -q 'name: migrate'
          ! echo "$rendered" | grep -q 'argocd.argoproj.io/hook'
          ! echo "$rendered" | grep -q '^kind: Job'

      - name: The migration uses the api image, so schema and code share a build
        run: |
          helm template moodboard deploy/chart --set image.tag=probe \
            | grep -A2 'name: migrate' | grep -q 'moodboard-api:probe'

      - name: Authentication is on by default
        # oidc.enabled=false is for a deployment with nothing to protect. If the default ever
        # flips, an exposed instance carrying real assets would serve them to anyone.
        run: |
          helm template moodboard deploy/chart | grep -A1 'name: AUTH_MODE' | grep -q 'value: oidc'

      - name: Disabled authentication says so explicitly
        # Not merely the absence of OIDC variables: the api is told, and the pod is annotated, so
        # the state is visible in the cluster and the api can fail closed.
        run: |
          rendered=$(helm template moodboard deploy/chart --set oidc.enabled=false)
          echo "$rendered" | grep -A1 'name: AUTH_MODE' | grep -q 'value: disabled'
          echo "$rendered" | grep -q 'moodboard.dev/auth: disabled'
          ! echo "$rendered" | grep -q 'key: clientSecret'

      - name: The emergency admin is off by default
        # A login that bypasses the IdP is opt-in (§4.10): no password hash mounted, no route.
        # `! cmd || exit 1`, not a bare `! cmd`: bash -e does not stop on a negated command, so
        # only the last line of a step would otherwise count.
        run: |
          rendered=$(helm template moodboard deploy/chart)
          echo "$rendered" | grep -A1 'name: EMERGENCY_ADMIN_ENABLED' | grep -q 'value: "false"'
          ! echo "$rendered" | grep -q 'key: passwordHash' || exit 1
          ! echo "$rendered" | grep -q 'name: moodboard-emergency$' || exit 1

      - name: The emergency login is routed to its own port only
        # "LAN only" rests on this: the emergency path reaches the second api port only through
        # its own IngressRoute, which carries the LAN entry points alone. A plain Ingress cannot
        # express that, so the chart refuses the combination.
        run: |
          rendered=$(helm template moodboard deploy/chart --set emergencyAdmin.enabled=true \
            --set 'ingress.entryPoints={lan,internet}' --set 'emergencyAdmin.entryPoints={lan}')
          route=$(echo "$rendered" | awk '/name: moodboard-emergency$/,/^---/')
          echo "$route" | grep -q 'port: 3001'
          echo "$route" | grep -A2 'entryPoints:' | grep -q -- '- lan'
          ! echo "$route" | grep -q -- '- internet' || exit 1
          ! helm template moodboard deploy/chart --set emergencyAdmin.enabled=true --set ingress.kind=Ingress || exit 1

      - name: A release does not restart Valkey
        # Valkey runs without persistence and holds the sessions, so a restart logs everyone out.
        # Its pod template must not change when only the release version does — a version label
        # in the template did exactly that on every deploy.
        run: |
          template() {
            helm template moodboard "$1" \
              | yq 'select(.kind == "Deployment" and .metadata.name == "moodboard-valkey") | .spec.template'
          }
          cp -r deploy/chart /tmp/chart-next
          sed -i 's/^version: .*/version: 99.0.0/; s/^appVersion: .*/appVersion: "99.0.0"/' /tmp/chart-next/Chart.yaml
          diff <(template deploy/chart) <(template /tmp/chart-next)

      - name: Image references are lower-cased
        # An OCI repository name may only contain lower case. A registry written ghcr.io/Owner
        # renders a pod stuck in InvalidImageName while the image is sitting there under the
        # lower-cased name, because the push lower-cases it too.
        run: |
          helm template moodboard deploy/chart --set image.registry=ghcr.io/Owner             | grep -q 'image: ghcr.io/owner/moodboard-api'

      - name: The worker has an enlarged /dev/shm
        # Chromium crashes on larger pages with the 64 MB default. The single most common cause
        # of "works locally, dies in the cluster" (§4.6).
        run: |
          helm template moodboard deploy/chart \
            | grep -q 'medium: Memory'
